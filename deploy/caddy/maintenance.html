<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>점검 중 · 바다거북 사무소</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: #1b1f21; color: #c9cec6;
    font-family: 'IBM Plex Sans KR', system-ui, -apple-system, sans-serif;
  }
  main {
    max-width: 440px; width: 100%; padding: 32px 28px;
    background: #dfe2d6; color: #1f2326; border-top: 6px solid #d6a935;
  }
  .tag { margin: 0 0 12px; font-size: 13px; letter-spacing: .12em; color: #8c6410; font-weight: 700; }
  h1 { margin: 0 0 16px; font-family: 'Nanum Myeongjo', 'AppleMyungjo', serif; font-size: 26px; }
  p { margin: 0; line-height: 1.7; color: #5b625d; }
  button {
    margin-top: 24px; padding: 10px 18px; border: 1px solid #1f2326; background: transparent;
    font: inherit; color: #1f2326; cursor: pointer;
  }
  button:hover { background: #1f2326; color: #dfe2d6; }
</style>
</head>
<body>
<main>
  <p class="tag">SERVICE NOTICE</p>
  <h1>잠시 점검 중입니다</h1>
  <p>바다거북 사무소가 잠시 문을 닫았습니다. 진행하던 사건 기록은 그대로 남아 있으니, 조금 뒤에 다시 찾아와 주세요.</p>
  <button type="button" onclick="location.reload()">다시 열어 보기</button>
</main>
</body>
</html>
