spring:
  application:
    name: sea-turtle-office

server:
  port: 8787

game:
  # world/, scenarios/가 있는 저장소 루트. backend/에서 실행하면 ".."이다.
  content-dir: ${GAME_CONTENT_DIR:..}
  # 판정 프롬프트에 넣을 최근 질문 수
  history-limit: 40
  # 진행 상태는 메모리에만 둔다. 마지막 활동 뒤 이 시간이 지나면 지운다.
  idle-ttl: 6h

llm:
  # auto | openai | fake
  # auto: OPENAI_API_KEY가 있으면 openai, 없으면 fake(모든 질문에 '상관없음')
  provider: ${LLM_PROVIDER:auto}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-5-mini}
    # 추론 모델에만 보낸다. 비우면 보내지 않는다.
    reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
    timeout: 60s
