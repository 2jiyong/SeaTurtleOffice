spring:
  application:
    name: sea-turtle-office
  # 배포에서는 환경 변수로 넘긴다. bootRun에서는 docker compose 연결 정보가 이 값을 덮어쓴다.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/seaturtle}
    username: ${DB_USER:seaturtle}
    password: ${DB_PASSWORD:seaturtle}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  docker:
    compose:
      # bootRun은 backend/에서 돈다.
      file: ../compose.yaml

server:
  port: 8080

game:
  # scenarios/가 있는 저장소 루트. backend/에서 실행하면 ".."이다.
  content-dir: ${GAME_CONTENT_DIR:..}
  # 기기 쿠키(sto_client)에 Secure를 붙인다. HTTPS 배포에서 true.
  cookie-secure: ${COOKIE_SECURE:false}
  # events.ip_hash에 섞는 비밀 값. 배포에서는 반드시 바꾼다.
  ip-hash-secret: ${IP_HASH_SECRET:dev-only}

# 판정은 파이썬 AI 서버(ai/)가 한다. OpenAI 키도 거기에만 둔다.
judge:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  # AI 서버(OpenAI 최대 24초)보다 조금 길게, 화면(30초)보다 짧게. 안쪽이 먼저 포기해야 결과가 버려지지 않는다.
  timeout: 28s

# 판정 사용량 한도(3단계). 0 이하면 그 검사를 끈다. 단가는 100만 토큰당 달러(gpt-5-mini 기준).
limits:
  daily-budget-usd: ${LIMIT_DAILY_BUDGET_USD:2.0}
  device-per-day: ${LIMIT_DEVICE_PER_DAY:200}
  ip-per-day: ${LIMIT_IP_PER_DAY:600}
  # 서버 전체 동시 판정 상한. 넘으면 503(잠시 뒤 다시).
  max-in-flight: ${LIMIT_MAX_IN_FLIGHT:20}
  zone: Asia/Seoul
  price:
    input: 0.25
    cached-input: 0.025
    output: 2.0

# 개발 로그에도 요청 ID를 찍는다. 배포에서는 LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs로 JSON 한 줄(MDC와 키가 함께 나간다).
logging:
  pattern:
    correlation: "[%X{requestId:-}] "
