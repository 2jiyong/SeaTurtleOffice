spring:
  application:
    name: sea-turtle-office

server:
  port: 8080

game:
  # scenarios/가 있는 저장소 루트. backend/에서 실행하면 ".."이다.
  content-dir: ${GAME_CONTENT_DIR:..}
  # 진행 상태는 메모리에만 둔다. 마지막 활동 뒤 이 시간이 지나면 지운다.
  idle-ttl: 6h

# 판정은 파이썬 AI 서버(ai/)가 한다. OpenAI 키도 거기에만 둔다.
judge:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  # AI 서버(OpenAI 최대 40초)보다 조금 길게, 화면(50초)보다 짧게. 안쪽이 먼저 포기해야 결과가 버려지지 않는다.
  timeout: 45s
